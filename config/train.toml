# The preprocessing config controls input size, color, and augmentation.
preprocess_config = "config/preprocess.toml"
output_dir = "runs/focused_400x200"

seed = 1234
epochs = 30
batch_size = 32
num_workers = 4
validation_fraction = 0.05
device = "auto"               # auto, cpu, mps, or cuda
mixed_precision = true         # used on CUDA; full precision on MPS/CPU

[model]
stem_width = 16
stride4_width = 32
stride4_blocks = 2
stride8_width = 64
stride8_blocks = 6

[sampling]
wider_face = 0.50
crowdhuman = 0.25
scut_head = 0.20
open_images = 0.05

[optimizer]
learning_rate = 0.001
minimum_learning_rate = 0.00001
weight_decay = 0.0001
gradient_clip = 5.0

[loss]
heatmap_weight = 1.0
offset_weight = 1.0

[evaluation]
top_k = 100
score_floor = 0.01
operating_threshold = 0.30
