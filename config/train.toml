# Spatial-control training of the temporal graph.
preprocess_config = "config/preprocess.toml"
model_config = "config/temporal.toml"
output_dir = "runs/temporal_spatial"

seed = 1234
epochs = 30
batch_size = 32
num_workers = 4
device = "auto"               # auto, cpu, mps, or cuda
mixed_precision = true         # used on CUDA; full precision on MPS/CPU

[sampling]
wider_face = 0.50
crowdhuman = 0.25
scut_head = 0.20
open_images = 0.05

[optimizer]
learning_rate = 0.001
minimum_learning_rate = 0.00001
weight_decay = 0.0001
gradient_clip = 5.0

[loss]
heatmap_weight = 1.0
offset_weight = 1.0

[evaluation]
top_k = 100
score_floor = 0.01
operating_threshold = 0.30
