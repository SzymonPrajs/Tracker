# Match the temporal model's usual host size. 400x200 is a later comparison.
input_width = 320
input_height = 160
output_stride = 4
color = "luminance"           # the temporal model takes one luminance plane
minimum_target_pixels = 12     # smaller annotated heads are masked, not negative
maximum_train_targets = 20     # skip very dense crowd frames during training

# One run of preprocess.py draws this many examples for visual inspection.
preview_count = 16
seed = 1234

# A clean branch is always kept. The remaining images independently receive
# the enabled effects below.
clean_probability = 0.20
warp_probability = 0.55
warp_strength_min = 0.05
warp_strength_max = 0.45
dark_probability = 0.55
exposure_min = 0.25
exposure_max = 0.90
gamma_min = 0.80
gamma_max = 1.50
noise_probability = 0.55
read_noise_max = 0.035
shot_noise_max = 0.070
blur_probability = 0.20
