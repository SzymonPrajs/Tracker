[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "tracker-training"
version = "0.1.0"
description = "Local Apple-Silicon training and export tools for HC-DS31"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<3",
  "pillow>=10,<13",
  "torch>=2.9,<3",
]

[project.optional-dependencies]
mlx = ["mlx==0.32.0"]
export = ["onnx==1.17.0"]
test = ["pytest==8.4.2"]

[tool.setuptools]
packages = ["tracker_training"]
