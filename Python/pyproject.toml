[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "data-pipeline"
version = "0.1.0"
description = "Bounded dataset acquisition and canonical packets for Tracker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=11,<13",
  "pydantic>=2.11,<3",
]

[dependency-groups]
dev = [
  "pytest>=8.4,<9",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["data_pipeline"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
